[package]
name = "rusttune"
version = "1.0.0"
edition = "2021"
license = "MIT-0"
repository = "https://github.com/dfrost16/rusttune"

[dependencies]
slint = { version = "1.18.1", default-features = false, features = ["compat-1-2", "renderer-software", "std"] }
fontique = { version = "0.11.1", default-features = false, features = ["fontconfig-dlopen"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
libloading = "0.9.0"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mp3", "pcm"] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
